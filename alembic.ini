# Alembic configuration.
#
# The database URL is deliberately absent: it is read from application settings
# in migrations/env.py, so credentials live in one place and a migration cannot
# be run against a different database than the application uses.
[alembic]
script_location = migrations
prepend_sys_path = .
# UTC, and a timestamp prefix so migrations sort chronologically in a listing.
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
