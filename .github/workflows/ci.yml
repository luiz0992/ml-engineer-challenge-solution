# Continuous integration.
#
# Fast checks first: lint and type-check finish in under a minute and catch the
# majority of problems, so a broken formatting run does not wait behind a
# five-minute test job. Jobs that can run concurrently do.
#
# The test job runs against real Postgres and Redis services rather than mocks,
# because the sliding-window rate limiter is a Lua script and the audit trail is
# SQL -- neither is meaningfully exercised against a stand-in.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch. Without this, pushing three times
# in a minute queues three full pipelines and the first two are wasted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.6"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        # --no-install-project: the checks need the dependencies, not a built
        # wheel of our own package.
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy api models worker scripts tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mlapi
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mlapi
        ports: ["5432:5432"]
        # Without a health check the job races the database's initialisation
        # and fails intermittently, which is worse than failing consistently.
        options: >-
          --health-cmd "pg_isready -U mlapi -d mlapi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      LOG_FORMAT: console
      POSTGRES_HOST: localhost
      POSTGRES_USER: mlapi
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: mlapi
      REDIS_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        # The training extra (torch, CUDA) is deliberately excluded: the suite
        # runs against a synthetic ONNX model, so pulling several gigabytes of
        # GPU wheels would add minutes to every run for tests that skip anyway.
        run: uv sync --extra dev --frozen

      - name: Verify migrations apply and reverse
        # A migration that cannot be rolled back is a production trap, and the
        # cheapest place to discover that is here.
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Verify no test is silently skipped
        # A skipped test reads as a pass in the summary. Any skip that is not
        # an explicitly-allowed one (missing model artifacts, which are not
        # committed) means coverage quietly disappeared.
        #
        # The database tests are deliberately *not* allowed to skip here. This
        # job supplies a real Postgres as a service container, so a skip means
        # they failed to connect to it rather than that the environment cannot
        # support them -- and those tests are the ones that found the audit
        # shutdown bug.
        run: |
          set -euo pipefail
          output=$(uv run pytest tests/ -q -rs --no-cov 2>&1 || true)
          echo "$output"
          unexpected=$(echo "$output" | grep "^SKIPPED" | grep -v "artifacts not found" \
            | grep -v "Tiny-ImageNet not found" | grep -v "require torchvision" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected skipped tests:"
            echo "$unexpected"
            exit 1
          fi

      - name: Verify the database tests ran against real Postgres
        # Belt and braces: the check above catches a skip, this catches the
        # tests disappearing entirely (a renamed file, a bad marker).
        run: |
          set -euo pipefail
          collected=$(uv run pytest tests/integration/test_database.py -q --collect-only \
            --no-cov 2>&1 | tail -2 | head -1)
          echo "$collected"
          if echo "$collected" | grep -q "no tests ran\|0 tests collected"; then
            echo "::error::The database integration tests did not run"
            exit 1
          fi

      - name: Run tests
        run: |
          uv run pytest \
            --cov=api \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --junitxml=junit.xml \
            -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  preprocessing-equivalence:
    name: Preprocessing equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install with the training transform
        # A separate job because torch is large and the rest of the suite does
        # not need it. It runs here rather than nowhere because
        # `pytest.importorskip("torch")` silently skips the whole module in the
        # main test job -- including TestTorchvisionEquivalence, which is the
        # only thing preventing the serving preprocessing from drifting away
        # from the training transform. Two silent accuracy bugs were found that
        # way; a skipped guard is no guard.
        #
        # CPU wheels, not the `train` extra. That extra also pulls
        # onnxruntime-gpu and tensorrt-cu12, which exhausted the runner's disk
        # ("No space left on device") -- several gigabytes of CUDA to compare
        # two resize implementations that run on the CPU.
        run: |
          uv sync --extra dev --frozen
          uv pip install --index-url https://download.pytorch.org/whl/cpu \
            torch torchvision

      - name: Run equivalence tests
        run: |
          uv run pytest tests/unit/test_image_processing.py -v

      - name: Fail if the equivalence tests were skipped
        # The point of this job is that these tests actually execute. A skip
        # here would restore exactly the gap it exists to close, and would look
        # like a pass.
        run: |
          set -euo pipefail
          output=$(uv run pytest tests/unit/test_image_processing.py -q -rs 2>&1)
          echo "$output"
          if echo "$output" | grep -qi "skipped"; then
            echo "::error::Preprocessing equivalence tests were skipped, not run."
            exit 1
          fi

  model-quality:
    name: Model regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Validate the committed baseline
        # The baseline itself is an artefact that can rot. A malformed or
        # incomplete one silently weakens every future comparison, so it is
        # checked rather than trusted.
        run: |
          uv run python - <<'PYTHON'
          from pathlib import Path
          from models.validation.regression import DEFAULT_SPECS, load_baseline

          baseline = load_baseline(Path("models/validation/baselines/classifier.json"))
          missing = [s.name for s in DEFAULT_SPECS if s.name not in baseline["metrics"]]
          if missing:
              raise SystemExit(f"Baseline is missing gated metrics: {missing}")

          print(f"Baseline {baseline['version']} recorded {baseline['recorded_at']}")
          for name, value in sorted(baseline["metrics"].items()):
              print(f"  {name:20s} {value}")
          PYTHON

      - name: Check for regressions
        # Skipped when no trained run is present: model artefacts are not
        # committed, so this gate is meaningful on a release branch where the
        # pipeline has produced one, and a no-op on an ordinary pull request.
        run: |
          if [ -d models/artifacts/runs ] && [ -n "$(ls -A models/artifacts/runs 2>/dev/null)" ]; then
            uv run python scripts/check_regression.py
          else
            echo "No trained run in the workspace; skipping the comparison."
            echo "The gate runs where the training pipeline has produced artefacts."
          fi

  docs-contract:
    name: Docs and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Verify the benchmark figures in the docs match the data
        # The headline latency table is generated from benchmarks/results.json
        # into marked blocks. Hand-copied numbers went stale within a single
        # re-run of the sweep, across five documents at once; this makes that
        # a build failure instead of something a reader finds.
        run: uv run python scripts/sync_docs.py --check

      - name: Verify the committed OpenAPI spec is current
        # `docs/openapi.json` is a deliverable that readers and client
        # generators consume. A spec that has drifted from the code documents
        # an API that no longer exists, and nothing else would notice.
        env:
          JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
        run: |
          set -euo pipefail
          uv run python - <<'PYTHON'
          import json
          from pathlib import Path

          from api.main import create_app

          current = create_app().openapi()
          committed = json.loads(Path("docs/openapi.json").read_text())

          if current != committed:
              raise SystemExit(
                  "docs/openapi.json is out of date. Regenerate it with:\n"
                  "  python -c 'import json; from api.main import create_app; "
                  "json.dump(create_app().openapi(), open(\"docs/openapi.json\",\"w\"), indent=2)'"
              )
          print(f"OpenAPI spec is current ({len(current['paths'])} paths)")
          PYTHON

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Audit dependencies for known vulnerabilities
        # Advisory rather than blocking: a CVE in a transitive dependency with
        # no available fix would otherwise block every unrelated pull request.
        # It is surfaced in the job summary and triaged deliberately.
        continue-on-error: true
        run: |
          uvx pip-audit --desc --format columns 2>&1 | tee audit.txt
          {
            echo "### Dependency audit"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan for hardcoded secrets
        # Blocking: a committed credential must never merge, and unlike a CVE
        # there is always an immediate fix.
        run: |
          uv run ruff check --select S105,S106,S107 --output-format=github .

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only after the fast checks pass: an image build is the most expensive
    # job here and there is no point building code that fails to lint.
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          tags: mlchal-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          tags: mlchal-worker:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build jobs image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: jobs
          tags: mlchal-jobs:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the jobs image can actually run the jobs
        # The drift job needs scipy, which the serving layer deliberately does
        # not carry. It previously shipped on the API image and crashed the
        # first time both drift windows had enough data to reach the KS test --
        # before that it exited early on an empty baseline and looked healthy.
        run: |
          set -euo pipefail
          docker run --rm mlchal-jobs:${{ github.sha }} \
            python -c "import scipy; from models.validation.drift import kolmogorov_smirnov; print('drift deps OK', scipy.__version__)"

          # And the converse: scipy must stay out of the serving image.
          if docker run --rm mlchal-api:${{ github.sha }} python -c "import scipy" 2>/dev/null; then
            echo "::error::scipy leaked into the serving image"
            exit 1
          fi
          echo "scipy absent from the API image, as intended"

      - name: Verify image hardening
        # Asserts the properties the Dockerfile claims. A base image change
        # that silently reverts to root would otherwise ship unnoticed.
        run: |
          set -euo pipefail

          user=$(docker run --rm mlchal-api:${{ github.sha }} id -un)
          if [ "$user" = "root" ]; then
            echo "::error::The API image runs as root"
            exit 1
          fi
          echo "Runs as: $user"

          # The serving image must not carry the training stack. This is worth
          # asserting because an accidental import in api/ would pull torch
          # into the image and roughly quadruple its size.
          if docker run --rm mlchal-api:${{ github.sha }} python -c "import torch" 2>/dev/null; then
            echo "::error::torch is present in the serving image"
            exit 1
          fi
          echo "torch absent, as intended"

          size=$(docker image inspect mlchal-api:${{ github.sha }} --format='{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          if [ "$size" -gt 1610612736 ]; then
            echo "::error::Image exceeds 1.5 GB"
            exit 1
          fi

          # The container must size ONNX Runtime's thread pool from its cgroup
          # quota, not from the host's processor count. Getting this wrong is
          # silent and cost 8x on the measured image (102.8 ms against 12.4 ms
          # per classification), so it is asserted against a real CPU limit
          # rather than trusted.
          budget=$(docker run --cpus 2 mlchal-api:${{ github.sha }} \
            python -c "from api.services.runtime import available_cpus; print(available_cpus())")
          echo "Thread budget under --cpus 2: $budget"
          if [ "$budget" != "2" ]; then
            echo "::error::available_cpus() returned $budget for a 2-CPU container"
            exit 1
          fi

      - name: Validate Kubernetes and monitoring configuration
        # Written configuration that is never validated drifts. These run
        # against the real schemas and parsers, not a YAML linter: a manifest
        # can be valid YAML and still be rejected by the API server.
        run: |
          set -euo pipefail

          docker run -v "$PWD/deploy:/deploy:ro" --rm ghcr.io/yannh/kubeconform:latest \
            -strict -summary -kubernetes-version 1.30.0 /deploy/kubernetes/

          docker run -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" --rm \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml

          docker run -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" --rm \
            --entrypoint amtool prom/alertmanager:v0.28.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Verify every service is bounded and probed
        # Resource limits and health checks are easy to add for the services
        # someone thought about and easy to forget for the rest. `ml-api` and
        # `worker` inherit HEALTHCHECK from the Dockerfile; `migrate` is a
        # one-shot job.
        run: |
          set -euo pipefail
          # --format json so the check needs only the standard library. The
          # docker job never runs `uv sync`, so importing PyYAML here would
          # depend on whatever the runner image happens to ship.
          JWT_SECRET_KEY=ci POSTGRES_PASSWORD=ci \
            docker compose config --format json > /tmp/rendered.json
          python - <<'PYTHON'
          import json, sys

          services = json.load(open("/tmp/rendered.json"))["services"]
          inherits_healthcheck = {"ml-api", "worker"}
          one_shot = {"migrate"}

          unbounded = [
              name for name, spec in services.items()
              if not spec.get("deploy", {}).get("resources", {}).get("limits")
          ]
          unprobed = [
              name for name, spec in services.items()
              if not spec.get("healthcheck")
              and name not in inherits_healthcheck | one_shot
          ]

          if unbounded:
              print(f"::error::Services without resource limits: {unbounded}")
          if unprobed:
              print(f"::error::Services without a health check: {unprobed}")
          sys.exit(1 if unbounded or unprobed else 0)
          PYTHON

      - name: Validate Compose configuration
        run: |
          set -euo pipefail

          JWT_SECRET_KEY=ci POSTGRES_PASSWORD=ci \
            docker compose config --quiet
          echo "Development stack is valid"

          # The production overlay must refuse to render without secrets. A
          # deploy that silently falls back to a development credential is the
          # failure this check exists to prevent.
          if JWT_SECRET_KEY=ci POSTGRES_PASSWORD=ci \
               docker compose -f docker-compose.yml -f docker-compose.prod.yml \
               config --quiet 2>/dev/null; then
            echo "::error::The production overlay rendered without REDIS_PASSWORD or GRAFANA_PASSWORD"
            exit 1
          fi
          echo "Production overlay correctly requires its secrets"

          JWT_SECRET_KEY=ci POSTGRES_PASSWORD=ci REDIS_PASSWORD=ci GRAFANA_PASSWORD=ci \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          echo "Production stack is valid when secrets are supplied"
