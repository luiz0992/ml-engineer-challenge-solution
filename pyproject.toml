[project]
name = "ml-engineer-challenge"
version = "0.1.0"
description = "Production-ready multi-model computer vision API with a full MLOps pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Luiz F. G. dos Santos", email = "luiz.fernando0992@gmail.com" }]

dependencies = [
    # --- API layer -------------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",       # multipart/form-data image uploads
    "httpx>=0.27",

    # --- Auth ------------------------------------------------------------
    "pyjwt>=2.9",
    "passlib[argon2]>=1.7.4",

    # --- Persistence & cache --------------------------------------------
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",                  # async driver, used by the API
    "psycopg[binary]>=3.2",           # sync driver, used by Alembic + Celery
    "alembic>=1.14",
    "redis[hiredis]>=5.2",

    # --- Background jobs -------------------------------------------------
    "celery[redis]>=5.4",
    "flower>=2.0",

    # --- Observability ---------------------------------------------------
    "prometheus-client>=0.21",
    "structlog>=24.4",

    # --- Imaging ---------------------------------------------------------
    "pillow>=11.0",
    "numpy>=1.26,<2.3",
    "opencv-python-headless>=4.10",

    # --- Inference runtime -----------------------------------------------
    # onnxruntime-gpu is installed only in the GPU image; the slim API image
    # falls back to the CPU build. See docker/Dockerfile.
    "onnxruntime>=1.20",
    "onnx>=1.17",

    # --- Similarity search -----------------------------------------------
    "faiss-cpu>=1.9",

    # --- Setup scripts ---------------------------------------------------
    "requests>=2.32",
    "tqdm>=4.67",
]

[project.optional-dependencies]
# Heavy training-only stack. Not installed into the serving image, which keeps
# the API container small and its attack surface narrow.
train = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.46",
    "timm>=1.0.11",
    "datasets>=3.1",
    "pycocotools>=2.0.8",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "tqdm>=4.67",
    "requests>=2.32",
    "onnxruntime-gpu>=1.20",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "pytest-benchmark>=5.1",
    "anyio>=4.6",
    "fakeredis>=2.26",
    "testcontainers[postgres,redis]>=4.8",
    "locust>=2.32",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
    "psutil>=6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "models", "worker"]

# ---------------------------------------------------------------------------
# uv: pull torch from the CUDA 12.8 index. Ada (sm_89) is fully supported and
# cu128 wheels run under the CUDA 13.x driver via forward compatibility.
# ---------------------------------------------------------------------------
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "train" }]
torchvision = [{ index = "pytorch-cu128", extra = "train" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
# onnxruntime and onnxruntime-gpu both provide the `onnxruntime` module.
# Allow them to coexist in the training extra without uv resolution errors.
conflicts = []

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF", "S"]
ignore = [
    "B008",  # FastAPI's Depends()/File() in defaults is the idiomatic pattern
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts, bind to all interfaces, and take fixtures
# they do not reference by name.
"tests/**" = ["S101", "S104", "S105", "S106", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: fast, fully isolated tests with no external dependencies",
    "integration: requires Postgres/Redis (spun up via testcontainers)",
    "performance: latency and memory benchmarks; excluded from the default run",
    "gpu: requires a CUDA device",
    "slow: takes more than ~5 seconds",
]

[tool.coverage.run]
source = ["api"]
branch = true
omit = ["*/__init__.py", "*/migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
