# Local/CI Alertmanager config with delivery enabled.
#
# The committed `alertmanager.yml` has no webhook URLs: Alertmanager does no
# environment substitution, so an unset ${SLACK_WEBHOOK_URL} takes the
# container down. This overlay points every receiver at the in-stack webhook
# sink (`docker/webhook`), which writes alerts to JSONL instead of Slack.
#
#   docker compose -f docker-compose.yml -f docker-compose.alerts.yml up -d
#
# Production delivery still belongs in a secret manager; this proves the
# routing tree actually delivers.

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "model"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-warnings

  routes:
    - matchers:
        - severity = "critical"
      receiver: pagerduty
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    - matchers:
        - severity = "critical"
      receiver: slack-critical

    - matchers:
        - alertname =~ "ModelDrift.*|AuditDefaultPartition.*"
      receiver: slack-ml
      group_interval: 1h
      repeat_interval: 24h

inhibit_rules:
  - source_matchers:
      - alertname = "APIDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ["namespace"]

  - source_matchers:
      - alertname = "NoModelLoaded"
    target_matchers:
      - alertname =~ "InferenceFailures|HighErrorRate"

receivers:
  - name: pagerduty
    webhook_configs:
      - url: http://alert-webhook:8089/pagerduty
        send_resolved: true
  - name: slack-critical
    webhook_configs:
      - url: http://alert-webhook:8089/slack-critical
        send_resolved: true
  - name: slack-warnings
    webhook_configs:
      - url: http://alert-webhook:8089/slack-warnings
        send_resolved: true
  - name: slack-ml
    webhook_configs:
      - url: http://alert-webhook:8089/slack-ml
        send_resolved: false
