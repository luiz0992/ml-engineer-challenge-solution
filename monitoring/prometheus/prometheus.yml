# Prometheus scrape configuration.
#
# The API is scraped directly over the internal network rather than through the
# gateway, which denies /metrics publicly. Scraping through the gateway would
# also attribute every scrape to the gateway's rate-limit bucket.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    service: ml-engineer-challenge

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ml-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["ml-api:8000"]
        labels:
          component: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Batch jobs push here because they exit and cannot be scraped.
  # honor_labels preserves the job/instance labels the pusher set; without it
  # Prometheus overwrites them with the pushgateway's own, and every batch job
  # appears to come from the gateway.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
