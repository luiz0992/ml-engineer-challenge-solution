# Development stack.
#
#   docker compose up -d --build
#   docker compose logs -f ml-api
#
# Every service declares a health check, and dependants wait on
# `condition: service_healthy` rather than `service_started`. Without that,
# the API starts before Postgres finishes initialising and crash-loops until
# the database happens to be ready — which works, but makes a real failure
# indistinguishable from normal startup noise.
#
# Model artifacts are bind-mounted rather than baked into the image, so a new
# model version can be served without rebuilding, and the image stays small.

name: ml-engineer-challenge

x-api-env: &api-env
  APP_ENV: development
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env - generate with openssl rand -hex 32}
  POSTGRES_USER: ${POSTGRES_USER:-mlapi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-mlapi}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  ARTIFACTS_DIR: /app/models/artifacts
  INFERENCE_BACKEND: ${INFERENCE_BACKEND:-onnx}

x-logging: &default-logging
  # Bound log growth. Without this, a chatty container fills the host disk and
  # takes down every other service on the machine.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- Gateway ------------------------------------------------------------
  # Every long-running service carries a CPU and memory limit. The two that
  # matter for correctness are `ml-api` and `worker`: ONNX Runtime sizes its
  # thread pool from the CPU budget it can see, so an unlimited container on a
  # many-core host behaves very differently from a production one. The rest are
  # bounded so a single service cannot exhaust a development machine, and are
  # deliberately looser than the production overlay.
  api-gateway:
    image: nginx:1.27-alpine
    container_name: mlchal-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ml-api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost. nginx binds 0.0.0.0:80 (IPv4 only) while
      # `localhost` resolves to ::1 inside the container, so a probe using the
      # hostname connects over IPv6 to a port nothing is listening on and fails
      # with "connection refused" -- while the gateway is in fact serving
      # traffic perfectly. An orchestrator would restart a healthy container in
      # a loop.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    restart: unless-stopped
    networks: [frontend, backend]
    logging: *default-logging

  # --- Schema migrations ---------------------------------------------------
  # Runs to completion before the API starts. Migrations belong in their own
  # one-shot service rather than in the API's entrypoint: with several API
  # replicas, an entrypoint migration means N processes racing to apply the
  # same DDL.
  migrate:
    image: mlchal-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: mlchal-migrate
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # Short-lived jobs on the API image. Bounded so a runaway migration or
    # a drift window larger than expected cannot starve the serving path.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks: [backend]
    logging: *default-logging

  # --- Application --------------------------------------------------------
  ml-api:
    # Explicit tag so the built image is addressable, and so `up --no-build`
    # can reuse an image produced by CI rather than rebuilding.
    image: mlchal-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: mlchal-api
    environment: *api-env
    volumes:
      # Read-only: the serving process has no reason to modify model artifacts,
      # and a compromised container should not be able to swap the model.
      - ./models/artifacts:/app/models/artifacts:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Not published to the host: traffic arrives through the gateway. Exposing
    # it directly would bypass the gateway's rate limiting and the /metrics
    # deny rule.
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped
    networks: [frontend, backend]
    logging: *default-logging

  # --- Background worker ---------------------------------------------------
  worker:
    image: mlchal-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: mlchal-worker
    environment: *api-env
    volumes:
      - ./models/artifacts:/app/models/artifacts:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          # Higher than the API: each worker process loads its own model copy,
          # and concurrency is 2.
          memory: 6G
        reservations:
          memory: 2G
    restart: unless-stopped
    networks: [backend]
    logging: *default-logging

  # --- Cache and broker ----------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: mlchal-redis
    command:
      - redis-server
      - --maxmemory
      - 512mb
      # Evict least-recently-used keys under pressure rather than returning
      # errors. Cached inference results are reconstructible; refusing writes
      # would turn a full cache into failed requests.
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    restart: unless-stopped
    networks: [backend]
    logging: *default-logging

  # --- Database ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mlchal-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mlapi}
      # Faster initialisation and a deterministic collation, so index ordering
      # does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U and -d are required: the default `pg_isready` checks the `postgres`
      # database as the `postgres` user, which does not exist here and reports
      # healthy for the wrong reason during init.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlapi} -d ${POSTGRES_DB:-mlapi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped
    networks: [backend]
    logging: *default-logging

  # --- Scheduled maintenance -----------------------------------------------
  # Creates upcoming partitions and drops expired ones, then sleeps a day.
  #
  # A loop in a container rather than host cron, so the schedule ships with the
  # stack and cannot be forgotten when the service moves machines. In a real
  # deployment this belongs in the orchestrator's scheduler (a Kubernetes
  # CronJob), which gives retries, history, and alerting on failure -- a
  # sleeping container silently stops doing its job if it dies and `restart`
  # does not catch it.
  #
  # The partition job must stay ahead of inserts: rows arriving with no matching
  # partition land in the DEFAULT partition, which retention will never drop.
  maintenance:
    # The jobs image, not the API image: `analyse_drift` runs a
    # Kolmogorov-Smirnov test and needs scipy, which is deliberately absent
    # from the serving layer. Sharing the API image meant this crashed the
    # first time both drift windows had data.
    image: mlchal-jobs:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: jobs
    container_name: mlchal-maintenance
    environment: *api-env
    # These reuse a serving image layer and would inherit its HEALTHCHECK, which
    # probes an HTTP port they do not serve -- leaving them permanently
    # unhealthy and, worse, making a genuinely broken job indistinguishable
    # from a working one. A sleeping scheduler has no meaningful readiness
    # signal; its health is whether its runs succeed, which is what the pushed
    # metrics report.
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python -m scripts.maintain_partitions --push-metrics \
            || echo "[maintenance] failed; will retry tomorrow"
          sleep 86400
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Short-lived jobs on the API image. Bounded so a runaway migration or
    # a drift window larger than expected cannot starve the serving path.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks: [backend, monitoring]
    logging: *default-logging

  # --- Drift analysis --------------------------------------------------------
  # Runs daily and pushes results to Prometheus, so drift alerts route through
  # the same rules and on-call rotation as everything else. A scheduled job
  # that only writes to stdout is not alerting -- nobody reads a container log
  # on a schedule.
  drift:
    # The jobs image, not the API image: `analyse_drift` runs a
    # Kolmogorov-Smirnov test and needs scipy, which is deliberately absent
    # from the serving layer. Sharing the API image meant this crashed the
    # first time both drift windows had data.
    image: mlchal-jobs:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: jobs
    container_name: mlchal-drift
    environment: *api-env
    # These reuse a serving image layer and would inherit its HEALTHCHECK, which
    # probes an HTTP port they do not serve -- leaving them permanently
    # unhealthy and, worse, making a genuinely broken job indistinguishable
    # from a working one. A sleeping scheduler has no meaningful readiness
    # signal; its health is whether its runs succeed, which is what the pushed
    # metrics report.
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[drift] $$(date -Iseconds) analysing"
          python -m scripts.analyse_drift \
            --baseline-days 7 --current-days 1 \
            --push-metrics --pushgateway pushgateway:9091 \
            || echo "[drift] analysis failed; will retry tomorrow"
          sleep 86400
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Short-lived jobs on the API image. Bounded so a runaway migration or
    # a drift window larger than expected cannot starve the serving path.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks: [backend, monitoring]
    logging: *default-logging

  # --- Monitoring ----------------------------------------------------------
  # Batch jobs exit, so there is nothing for Prometheus to scrape. They push
  # here instead.
  pushgateway:
    image: prom/pushgateway:v1.11.0
    container_name: mlchal-pushgateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9091/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
    networks: [backend, monitoring]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mlchal-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      ml-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped
    networks: [backend, monitoring]
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: mlchal-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
    networks: [monitoring]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.5.1
    container_name: mlchal-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped
    networks: [monitoring]
    logging: *default-logging

# Segmented networks. The database and broker sit on `backend` only, so they
# are unreachable from anything that can talk to the outside world. A flat
# network would let a compromised gateway reach Postgres directly.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  alertmanager-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
