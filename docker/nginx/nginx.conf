# Nginx API gateway.
#
# Terminates client connections, enforces coarse limits, and proxies to the
# application. Putting these concerns here rather than in the application means
# abusive traffic is rejected before it reaches Python, where each request
# would otherwise occupy a worker.
#
# The application's own rate limiting is per authenticated user and per tier.
# This layer is per IP and deliberately cruder: it exists to absorb floods from
# a single source, including unauthenticated ones that never reach the auth
# middleware.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log the correlation ID and upstream timing, so a slow request can be
    # traced from the gateway into the application logs by a single identifier.
    log_format json_combined escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"path":"$uri",'
          '"status":$status,'
          '"bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_time":"$upstream_response_time",'
          '"correlation_id":"$upstream_http_x_correlation_id",'
          '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # --- Upload limits ----------------------------------------------------
    # Slightly above the application's 10 MiB limit so that an oversized upload
    # receives the application's structured JSON error rather than nginx's HTML
    # 413. Requests far beyond the limit are still cut off here.
    client_max_body_size 12m;
    client_body_buffer_size 1m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # --- Rate limiting ----------------------------------------------------
    # Per-IP zones. 10 MB holds roughly 160,000 addresses.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=api_inference:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # --- Upstream ---------------------------------------------------------
    upstream ml_api {
        server ml-api:8000 max_fails=3 fail_timeout=15s;
        # Reuse connections to the application rather than reconnecting per
        # request, which removes a TCP handshake from every call.
        keepalive 32;
    }

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;
    # Image uploads and responses are already compressed; re-compressing costs
    # CPU for nothing.
    gzip_proxied any;

    server {
        listen 80;
        server_name _;

        # --- Security headers ---------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # --- Shared proxy configuration ------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Propagate an inbound correlation ID so a trace started by the client
        # survives into the application.
        proxy_set_header X-Correlation-ID $http_x_correlation_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Stream request bodies straight through. Buffering a 10 MiB upload to
        # disk before forwarding it adds latency and disk I/O for no benefit.
        proxy_request_buffering off;

        limit_conn conn_per_ip 32;

        # --- Inference endpoints -------------------------------------------
        location ~ ^/api/v1/(classify|detect) {
            limit_req zone=api_inference burst=40 nodelay;
            proxy_pass http://ml_api;
        }

        # --- Authentication -------------------------------------------------
        # Tighter limit: this endpoint verifies credentials, so it is the
        # natural target for credential stuffing.
        location = /api/v1/auth/token {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://ml_api;
        }

        # --- Metrics --------------------------------------------------------
        # Not exposed publicly. Metrics reveal traffic volumes, model names, and
        # error rates; Prometheus scrapes the application directly over the
        # internal network.
        location = /api/v1/metrics {
            deny all;
            return 404;
        }

        # --- Health probes --------------------------------------------------
        # Unrated: a rate-limited health check turns a traffic spike into a
        # false unhealthy signal and removes a working instance from service.
        location /health/ {
            access_log off;
            proxy_pass http://ml_api;
        }

        # --- Everything else -------------------------------------------------
        location / {
            limit_req zone=api_general burst=100 nodelay;
            proxy_pass http://ml_api;
        }
    }
}
